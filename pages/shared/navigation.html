<style>
a{ text-decoration:none }
main a,header a,.site-menu a{display:inline-flex;align-items:center;padding:8px 12px;border-radius:9px;background:#e8eeff;color:#203788;font-weight:750;text-decoration:none}
header a:hover,main a:hover,.site-menu a:hover{filter:brightness(.94)}
.site-menu a{display:block;margin-top:5px}
#notice:empty{display:none}
body{padding-bottom:calc(68px + env(safe-area-inset-bottom))}.tabbar{position:fixed;inset:auto 0 0;z-index:20;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:4px max(4px,calc((100vw - 740px)/2)) env(safe-area-inset-bottom);background:#f8faff;border-top:1px solid #dce4f2;box-shadow:0 -3px 16px #17274612}.tabbar a,.tabbar button{display:grid;justify-items:center;align-content:center;gap:1px;min-height:57px;min-width:0;width:auto;padding:2px;text-decoration:none;background:none;color:#415374;border:0;font:750 12px system-ui;text-align:center}.tabbar a[aria-current]{color:#1c42b9;background:#e8eeff;border-radius:10px}.tabbar span{font-size:19px;line-height:1.3}.site-menu{border:1px solid #dce4f2;border-radius:18px;max-width:min(90vw,350px);width:100%;padding:19px;color:#172746}.site-menu::backdrop{background:#17274672}.site-menu a{display:block;padding:10px;color:#203788;text-decoration:none}.site-menu h2{margin:4px 0}.site-menu button{margin-top:8px}
</style>
<nav class="tabbar" aria-label="Điều hướng chính">
<a href="/"><span aria-hidden="true">🏠</span>Trang chủ</a>
<a href="/#topics"><span aria-hidden="true">📖</span>Học bài</a>
<a href="/lop-hoc#messages"><span aria-hidden="true">💬</span>Nhắn tin</a>
<a href="/#exams"><span aria-hidden="true">⏱️</span>Thi thử</a>
<button type="button" id="show-site-menu" aria-haspopup="dialog"><span aria-hidden="true">☰</span>Menu</button>
</nav>
<dialog class="site-menu" id="site-menu" aria-labelledby="site-menu-title">
<h2 id="site-menu-title">Menu</h2>
<a href="/lop-hoc">Lớp học</a>
<a href="/lop-hoc#online-exams">Đề online</a>
<a href="/lop-hoc#assignments">Đề được giao</a>
<a href="/lop-hoc#scores">Lịch sử điểm</a>
<a href="/lop-hoc#messages">Nhắn tin</a>
<a href="/lop-hoc?mode=register">Đăng ký học sinh</a>
<form method="dialog"><button>Đóng menu</button></form>
</dialog>
<script>
{
 const menu=document.getElementById('site-menu');
 const items=document.querySelectorAll('.tabbar a');
 document.getElementById('show-site-menu').onclick=()=>menu.showModal();
 menu.querySelectorAll('a').forEach(item=>item.onclick=()=>menu.close());
 function updateTabs(){
   const route=location.pathname+location.hash;
   items.forEach(item=>{
     if(item.getAttribute('href')===route)item.setAttribute('aria-current','location');
     else item.removeAttribute('aria-current');
   });
   if(location.pathname==='/'&&location.hash&&document.getElementById('home')?.hidden){
     showHome();
     document.getElementById(location.hash.slice(1))?.scrollIntoView();
   }
 }
 window.addEventListener('hashchange',updateTabs);
 updateTabs();
}
</script>
