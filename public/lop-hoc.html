<script>
function importExamText(source){
 const text=source.normalize('NFC').replace(/\r/g,'').replace(/\u00a0/g,' ');
 const marker=/^\s*(?:[\p{L}\d -]{0,25}\s)?(?:ĐÁP ÁN(?:\s+VÀ\s+(?:HƯỚNG DẪN CHẤM|THANG ĐIỂM))?|HƯỚNG DẪN CHẤM)\s*[:.]?\s*$/imu;
 const header=text.search(/^.*\bHDC\s+ĐỀ[^\n]*$/imu);
 const split=header>=0?header:text.search(marker);
 let paper=split<0?text:text.slice(0,split);
 paper=paper.replace(/(Câu\s+)(\d)\s+(\d)(?=\s*[.:])/giu,'$'+'1'+'$'+'2'+'$'+'3');
 let key=split<0?'':text.slice(split);
 const variants=[...paper.matchAll(/^\s*(?:MÃ\s+)?ĐỀ\s+(\d{2,5})\s*$/gimu)];
 if(variants.length){
   const id=variants[0][1];
   if(variants[1])paper=paper.slice(0,variants[1].index);
   const tables=[...key.matchAll(/^\s*(?:MÃ\s+)?ĐỀ\s+(\d{2,5})\s*$/gimu)];
   const idx=tables.findIndex(table=>table[1]===id);
   if(idx>=0)key=key.slice(tables[idx].index,tables[idx+1]?.index);
 }
 const answers=new Map();
 for(const [,number,answer] of key.matchAll(/(?:^|[\s;])(?:Câu\s+)?(\d{1,2})\s*[.):-]\s*([A-D](?=\s|$)|[−-]?\d+(?:[.,/]\d+)?)(?=\s|;|$)/gimu))answers.set(Number(number),answer.toUpperCase());
 const rows=key.split('\n').map(line=>line.trim().split(/\s+|\|/).filter(Boolean));
 rows.forEach((row,i)=>{
   if(!/^câu$/i.test(row[0]||''))return;
   const numbers=row.slice(1);
   const options=rows[i+1]?.filter(value=>/^[A-D]$/i.test(value));
   if(numbers.length&&numbers.every(n=>/^\d{1,2}$/.test(n))&&options?.length===numbers.length)numbers.forEach((n,j)=>answers.set(Number(n),options[j].toUpperCase()));
 });
 const blocks=Array.from(paper.matchAll(/^\s*(Câu|Bài)\s+(\d{1,2})\s*[.:)\-]\s*([\s\S]*?)(?=^\s*(?:Câu|Bài)\s+\d{1,2}\s*[.:)\-]|$\s*(?![\s\S]))/gimu));
 return blocks.slice(0,40).map(([,label,number,block])=>{
   const answer=label.toLowerCase()==='câu'&&!/^\(\s*\d+(?:[.,]\d+)?\s*điểm/i.test(block)?answers.get(Number(number))||'':'';
   const matches=Array.from(block.matchAll(/(?:^|\s)([A-D])\s*[.)]\s+/gm));
   if(matches.map(m=>m[1]).join('')==='ABCD'){
     const options=matches.map((m,i)=>block.slice(m.index+m[0].length,matches[i+1]?.index).trim());
     return {type:'choice',prompt:block.slice(0,matches[0].index).trim(),options,answer:/^[A-D]$/.test(answer)?answer:''};
   }
   return {type:answer&&!/^[A-D]$/.test(answer)?'short':'image',prompt:block.trim(),answer:/^[A-D]$/.test(answer)?'':answer};
 });
}
async function examFileText(file){
 if(file.size>12000000)throw new Error('Tệp tối đa 12 MB.');
 if(!file.name.toLowerCase().endsWith('.pdf'))return file.text();
 const base='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/legacy/build/';
 const pdfjs=await import(base+'pdf.mjs');
 pdfjs.GlobalWorkerOptions.workerSrc=base+'pdf.worker.mjs';
 const document=await pdfjs.getDocument({data:await file.arrayBuffer(),isEvalSupported:false}).promise;
 try{
   if(document.numPages>35)throw new Error('PDF tối đa 35 trang.');
   const pages=[];
   for(let i=1;i<=document.numPages;i++){
     const page=await document.getPage(i);
     const {items}=await page.getTextContent();
     let line='',y,lines=[];
     for(const item of items){
       if(typeof item.str!=='string')continue;
       const next=item.transform[5];
       if(line&&Math.abs(next-y)>3){lines.push(line);line=''}
       line+=(line?' ':'')+item.str;y=next;
       if(item.hasEOL){lines.push(line);line=''}
     }
     if(line)lines.push(line);
     pages.push(lines.join('\n'));
   }
   return pages.join('\n');
 }finally{await document.destroy()}
}
function examTextarea(value,max){
 const input=make('textarea');input.value=value||'';input.maxLength=max;input.rows=3;return input;
}
function examEditor(parent){
 const box=make('div');parent.append(box);
 const upload=make('input');upload.type='file';upload.accept='.pdf,.txt';
 field(box,'Tải đề PDF hoặc TXT',upload);
 const source=field(box,'Nội dung đề ToanMath',examTextarea('',150000));
 source.placeholder='Câu 1. …\nA. …  B. …  C. …  D. …\nĐÁP ÁN\n1. B';
 upload.onchange=()=>run(upload,async()=>{
   if(!upload.files[0])return;
   source.value=await examFileText(upload.files[0]);
   if(!source.value.trim())throw new Error('PDF không có lớp chữ. Hãy dán nội dung hoặc nhập câu thủ công.');
 });
 const edit=make('div');
 const rows=[];
 function add(data={}){
   if(rows.length>=40)throw new Error('Một đề có tối đa 40 câu.');
   const group=make('fieldset');group.append(make('legend','Câu '+(rows.length+1)));
   const type=field(group,'Loại câu',select([['choice','Trắc nghiệm A–D'],['short','Điền đáp án'],['image','Nộp ảnh tự luận']]));
   type.value=data.type||'choice';
   const prompt=field(group,'Nội dung',examTextarea(data.prompt,2500));
   const extra=make('div');group.append(extra);
   const options=['A','B','C','D'].map((letter,i)=>{
     const el=input('text');el.required=false;el.maxLength=600;el.value=data.options?.[i]||'';field(extra,letter,el);return el;
   });
   const answer=input('text');answer.required=false;answer.maxLength=150;answer.value=data.answer||'';
   const answerWrap=make('div');field(answerWrap,'Đáp án',answer);group.append(answerWrap);
   function sync(){extra.hidden=type.value!=='choice';answerWrap.hidden=type.value==='image';answer.placeholder=type.value==='choice'?'A, B, C hoặc D':'Ví dụ 3/4'}
   type.onchange=sync;sync();
   const row={group,type,prompt,options,answer};
   group.append(button('Bỏ câu này',async()=>{rows.splice(rows.indexOf(row),1);group.remove();rows.forEach((q,i)=>q.group.firstChild.textContent='Câu '+(i+1))}));
   rows.push(row);edit.append(group);
 }
 box.append(button('Nhận diện câu hỏi',async()=>{
   const parsed=importExamText(source.value);
   if(!parsed.length)throw new Error('Chưa thấy dòng “Câu 1.” hoặc “Bài 1.”. Hãy chỉnh nội dung hoặc thêm câu thủ công.');
   rows.splice(0);edit.replaceChildren();parsed.forEach(add);
   notice.textContent='Đã nhận diện '+parsed.length+' câu. Hãy kiểm tra loại câu, công thức và đáp án trước khi lưu.';
 }),button('Thêm câu',async()=>add()),edit);
 const save=formIn(parent,'Lưu đề online',async()=>{
   const questions=rows.map(q=>({type:q.type.value,prompt:q.prompt.value,options:q.options.map(o=>o.value),answer:q.type.value==='choice'?q.answer.value.trim().toUpperCase():q.answer.value}));
   await api('/online/create',{title:title.value,questions});
   await render();notice.textContent='Đã lưu đề. Chọn học sinh và bấm Giao đề online.';
 });
 const title=field(save.form,'Tên đề',input('text'));title.maxLength=120;save.form.append(save.submit);
}
async function renderOnline(){
 const data=await api('/online/list'+(state.user.teacher&&student?'?student='+encodeURIComponent(student):''));
 const box=section(state.user.teacher?'Kho đề online':'Đề online được giao');box.id='online-exams';
 if(state.user.teacher){
   const editor=make('details');editor.append(make('summary','Tải đề và tạo đề online'));box.append(editor);
   examEditor(editor);
   if(student&&data.exams.length){
     const assign=formIn(box,'Giao đề online',async()=>{await api('/online/assign',{student,exam:pick.value});await render()});
     const pick=field(assign.form,'Đề đã lưu',select(data.exams.map(e=>[e.id,e.title])));assign.form.append(assign.submit);
   }
 }
 for(const row of data.assignments){
   const item=make('p',row.title+' · '+(row.auto_score===null?'Chưa nộp':row.manual_score===null?'Chờ chấm ảnh':(row.auto_score+row.manual_score)+' điểm'));
   if(!state.user.teacher||row.auto_score!==null)item.append(' ',button(row.auto_score===null?'Làm bài':'Xem bài nộp',()=>openOnline(row.id)));
   box.append(item);
 }
 if(!data.assignments.length)box.append(make('p','Chưa có đề online được giao.'));
}
async function compressExamImage(file){
 if(!file||!/^image\/(jpeg|png|webp)$/.test(file.type)||file.size>12000000)throw new Error('Chọn ảnh JPG, PNG hoặc WebP tối đa 12 MB.');
 const bitmap=await createImageBitmap(file);
 try{
   const canvas=make('canvas');const ctx=canvas.getContext('2d');
   for(const size of [1500,1200,900,650]){
     const scale=Math.min(1,size/Math.max(bitmap.width,bitmap.height));
     canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));
     ctx.fillStyle='white';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(bitmap,0,0,canvas.width,canvas.height);
     const data=canvas.toDataURL('image/jpeg',.76);
     if(data.length<=230000)return data;
   }
   throw new Error('Ảnh quá lớn. Hãy cắt sát vùng bài làm rồi thử lại.');
 }finally{bitmap.close()}
}
async function openOnline(id,original){
 const paper=original||await api('/online/paper?id='+encodeURIComponent(id)+(state.user.teacher?'&student='+encodeURIComponent(student):''));
 app.replaceChildren();
 const panel=section(paper.title);panel.append(paper.originalPath?link('← Danh sách đề','/#exams'):button('← Về lớp học',render));if(paper.article){
   panel.append(' ',paper.article);
   const reference=make('details');reference.append(make('summary','Xem PDF gốc để đối chiếu hình và công thức'));
   const frame=make('iframe');frame.title='Đề gốc ToanMath';frame.loading='lazy';frame.src='/api/original-pdf?path='+encodeURIComponent(paper.originalPath);frame.style.cssText='width:100%;height:55vh;border:0';reference.append(frame);panel.append(reference);
 }
 const answers=Array(paper.questions.length).fill('');
 const refs=[];
 let pendingPhotos=0;
 const progress=make('p');progress.setAttribute('aria-live','polite');
 const navigator=make('nav');navigator.className='question-nav';navigator.setAttribute('aria-label','Danh sách câu hỏi');
 panel.append(progress,navigator);
 const update=()=>{
   progress.textContent='Đã làm '+answers.filter(Boolean).length+'/'+answers.length+' câu';
   refs.forEach((ref,i)=>{ref.classList.toggle('done',!!answers[i]);ref.setAttribute('aria-label','Câu '+(i+1)+(answers[i]?', đã làm':', chưa làm'))});
 };
 paper.questions.forEach((q,i)=>{
   const group=make('fieldset');group.tabIndex=-1;group.append(make('legend','Câu '+(i+1)),make('p',q.prompt));
   const jump=button(String(i+1),async()=>{group.focus({preventScroll:true});group.scrollIntoView({block:'start'})});
   navigator.append(jump);refs.push(jump);
   if(paper.submission){
     const value=paper.submission.answers[i];answers[i]=value;
     if(q.type==='image'&&value){const img=make('img');img.src=value;img.alt='Bài làm câu '+(i+1);img.loading='lazy';group.append(img)}
     else group.append(make('p','Bài làm: '+(value||'Bỏ trống')));
     if(q.answer)group.append(make('p','Đáp án: '+q.answer));
   }else if(q.type==='choice'){
     q.options.forEach((value,j)=>{
       const choice=input('radio');choice.required=false;choice.name='exam-'+i;
       const letter='ABCD'[j];choice.onchange=()=>{answers[i]=letter;update()};
       field(group,letter+'. '+value,choice);
     });
   }else if(q.type==='short'){
     const answer=input('text');answer.maxLength=150;answer.required=false;field(group,'Đáp án',answer);
     answer.oninput=()=>{answers[i]=answer.value.trim();update()};
   }else{
     const photo=make('input');photo.type='file';photo.accept='image/jpeg,image/png,image/webp';
     const status=make('p');status.setAttribute('aria-live','polite');
     field(group,'Ảnh bài làm',photo);group.append(status);
     photo.onchange=async()=>{
       photo.disabled=true;pendingPhotos++;
       try{answers[i]=photo.files[0]?await compressExamImage(photo.files[0]):'';status.textContent=answers[i]?'Đã đính kèm ảnh.':''}
       catch(error){answers[i]='';photo.value='';status.textContent=error.message}
       finally{pendingPhotos--;photo.disabled=false;update()}
     };
   }
   panel.append(group);
 });
 update();
 if(paper.submission){
   const result=paper.submission;
   panel.append(make('p',paper.originalPath?(result.total?'Điểm tự luyện: '+result.auto_score+'/'+result.total+' câu có đáp án nhận diện được.':'Đã lưu lượt làm. PDF này chưa nhận diện được đáp án để chấm.'):'Điểm tự động: '+result.auto_score+' · Điểm tự luận: '+(result.manual_score??'Chờ chấm')));
   const imageCount=paper.questions.filter(q=>q.type==='image').length;
   if(state.user.teacher&&imageCount){
     const grade=formIn(panel,'Lưu điểm tự luận',async()=>{await api('/online/grade',{id,student,score:Number(score.value)});await openOnline(id)});
     const score=field(grade.form,'Điểm tự luận (tối đa '+imageCount+')',input('number'));
     score.min=0;score.max=imageCount;score.step='0.25';score.value=result.manual_score??'';grade.form.append(grade.submit);
   }
 }else{
   panel.append(button('Nộp bài',async()=>{
     if(pendingPhotos)throw new Error('Hãy đợi ảnh xử lý xong.');
     if(!answers.some(Boolean))throw new Error('Hãy làm ít nhất một câu trước khi nộp.');
     if(!answers.every(Boolean)&&!window.confirm('Còn câu bỏ trống. Bạn muốn nộp bài?'))return;
     if(paper.originalPath){
       const result=await saveOriginal(paper,answers);
       await openOnline(null,{...paper,submission:result});
     }else{await api('/online/submit',{id,answers});await openOnline(id)}
   }));
 }
 panel.scrollIntoView();
}
</script>

<script>
async function startOriginal(path){
 const panel=section('Đang chuẩn bị đề gốc');
 const url='/api/original-pdf?path='+encodeURIComponent(path);
 const article=link('Xem đề trên ToanMath ↗','https://thcs.toanmath.com'+path);
 article.target='_blank';article.rel='noopener noreferrer';
 panel.append(article);
 try{
   const response=await fetch(url);
   if(!response.ok)throw new Error('Chưa lấy được PDF của đề này.');
   const file=new File([await response.blob()],'de-goc.pdf',{type:'application/pdf'});
   const questions=importExamText(await examFileText(file));
   if(!questions.length)throw new Error('PDF này chưa tách được câu hỏi. Bạn có thể mở đề gốc trên ToanMath.');
   await openOnline(null,{title:'Làm đề gốc ToanMath',questions,submission:null,originalPath:path,article});
 }catch(error){panel.append(make('p',error.message))}
}
async function saveOriginal(paper,answers){
 const keys=paper.questions.map(q=>q.type==='image'?'':q.answer||'');
 const normalize=value=>value.trim().normalize('NFC').toLocaleLowerCase('vi').replace(/\s+/g,'').replace(/,/g,'.').replace(/−/g,'-');
 const total=keys.filter(Boolean).length;
 const score=keys.filter((key,i)=>key&&normalize(key)===normalize(answers[i])).length;
 const evidence=paper.questions.flatMap((q,i)=>keys[i]?[{prompt:q.prompt.slice(0,2500),type:q.type,correct:normalize(keys[i])===normalize(answers[i])}]:[]);
 await api('/original/history',{path:paper.originalPath,score,total,answers,evidence});
 return {answers,auto_score:score,manual_score:null,total};
}

</script>

<script>
const get=id=>document.getElementById(id);
const app=get('app'), notice=get('notice');
let state, student;
const make=(tag,value)=>{const el=document.createElement(tag);if(value!==undefined)el.textContent=value;return el};
function link(label,url){const el=make('a',label);el.href=url;return el}
async function api(path='',data){
 const res=await fetch('/api/class'+path,data===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
 const json=await res.json();
 if(!res.ok){const error=new Error(json.error);error.status=res.status;throw error}
 return json;
}
function section(title){const el=make('section');el.append(make('h2',title));app.append(el);return el}
function field(form,label,el){const wrap=make('label',label+' ');wrap.append(el);form.append(wrap);return el}
function input(type){const el=make('input');el.type=type;el.required=true;return el}
function select(values){const el=make('select');values.forEach(([key,name])=>{const option=make('option',name);option.value=key;el.append(option)});return el}
function button(label,action){const el=make('button',label);el.type='button';el.onclick=()=>run(el,action);return el}
async function run(el,action){el.disabled=true;notice.textContent='';try{await action()}catch(error){notice.textContent=error.message||'Có lỗi khi kết nối.'}finally{el.disabled=false}}
function formIn(parent,label,action){
 const form=make('form'), submit=make('button',label);
 submit.type='submit';parent.append(form);
 form.onsubmit=event=>{event.preventDefault();run(submit,action)};
 return {form,submit};
}
function topics(){return select(state.topics.map((title,i)=>[i,title]))}
function timestamp(value){return new Date(value.replace(' ','T')+'Z').toLocaleString('vi-VN',{timeZone:'Asia/Bangkok'})}
async function render(){
 const isTeacher=state.user.teacher;
 if(isTeacher&&!state.students.some(s=>s.email===student))student=state.students[0]?.email;
 const records=(!isTeacher||student)?await api('/records'+(isTeacher?'?student='+encodeURIComponent(student):'')):null;
 app.replaceChildren();
 if(isTeacher){
   const box=section('Quản lý học sinh');box.id='registrations';
   const {form,submit}=formIn(box,'Thêm hoặc cập nhật học sinh',async()=>{
     await api('/student',{student:email.value,name:name.value});student=email.value.trim().toLowerCase();state=await api();await render();
   });
   const name=field(form,'Họ tên',input('text')),email=field(form,'Email Google',input('email'));
   name.maxLength=80;email.maxLength=254;form.append(submit);
   const applicants=state.students.filter(s=>s.pending);
   if(applicants.length){
     box.append(make('h3','Đăng ký chờ duyệt'));
     for(const applicant of applicants){
       const item=make('p',applicant.name+' · '+applicant.email+(applicant.phone?' · '+applicant.phone:''));
       item.append(' ',button('Chấp nhận',async()=>{
         await api('/access',{student:applicant.email,active:true});student=applicant.email;state=await api();await render();
       }));
       box.append(item);
     }
   }
   if(!student){await renderOnline();return}
   const picker=select(state.students.map(s=>[s.email,s.name+' · '+s.email+(s.active?'':s.pending?' · Chờ duyệt':' · Đã khóa')]));
   picker.value=student;picker.onchange=()=>run(picker,async()=>{student=picker.value;await render()});
   field(box,'Hồ sơ đang xem',picker);
   const profile=state.students.find(s=>s.email===student);
   const {active,pending,phone}=profile;
   if(phone)box.append(make('p','Số điện thoại: '+phone));
   if(pending)box.append(make('p','Đăng ký chờ duyệt'));
   box.append(button(active?'Khóa quyền vào lớp':pending?'Chấp nhận':'Mở lại quyền vào lớp',async()=>{
     await api('/access',{student,active:!active});state=await api();await render();
   }));
   const assign=section('Giao đề');
   const assignment=formIn(assign,'Giao cho học sinh đang chọn',async()=>{
     await api('/assignment',{student,title:title.value,topic:Number(topic.value)});await render();
   });
   const title=field(assignment.form,'Tên bài',input('text')),topic=field(assignment.form,'Chủ đề',topics());
   title.maxLength=120;assignment.form.append(assignment.submit);
 }else{
   const practice=section('Tự luyện có lưu điểm');
   const topic=topics();field(practice,'Chọn chủ đề',topic);
   practice.append(button('Làm bài',()=>startQuiz(Number(topic.value))));
 }
 await renderOnline();
 const assignments=section('Đề được giao');assignments.id='assignments';
 if(!records.assignments.length)assignments.append(make('p','Chưa có đề được giao.'));
 for(const row of records.assignments){
   const item=make('p',row.title+' · '+state.topics[row.topic]+' · '+(row.score===null?'Chưa nộp':row.score+'/'+row.total));
   if(!isTeacher&&row.score===null)item.append(' ',button('Làm đề',()=>startQuiz(row.topic,row.id)));
   assignments.append(item);
 }
 if(isTeacher){
   const insights=await api('/insights?student='+encodeURIComponent(student));
   const tracking=section('Theo dõi học sinh');
   const weaknesses=insights.topics.filter(row=>row.correct<row.total);
   if(!weaknesses.length)tracking.append(make('p',insights.topics.length?'Chưa thấy lỗi trong các bài đã chấm.':'Chưa có bài đã chấm để nhận xét.'));
   for(const row of weaknesses)tracking.append(make('p',row.topic+' · đúng '+row.correct+'/'+row.total+' câu · '+(row.total<3?'Cần thêm bài để đánh giá':'Nên luyện thêm')));
   for(const row of insights.selfPractice){
     const item=make('p','Đề ToanMath tự luyện · '+(row.total?row.score+'/'+row.total:'Chưa chấm được')+' · '+timestamp(row.created)+(row.misses.length?' · Cần ôn: '+row.misses.join(', '):''));
     item.append(' ',link('Mở nguồn đề','https://thcs.toanmath.com'+row.path));tracking.append(item);
   }
   for(const row of insights.assignments)tracking.append(make('p',row.title+' · '+row.score+'/'+row.total+(row.pending?' · Chờ chấm ảnh':'')+(row.misses.length?' · Cần ôn: '+row.misses.join(', '):'')));
 }
 const scores=section('Lịch sử điểm');scores.id='scores';
 if(!records.scores.length)scores.append(make('p','Chưa có bài đã chấm.'));
 for(const row of records.scores)scores.append(make('p',state.topics[row.topic]+' · '+row.score+'/'+row.total+' · '+timestamp(row.created)));
 const messages=section('Nhận xét và tin nhắn riêng');messages.id='messages';
 const chat=formIn(messages,'Gửi',async()=>{await api('/message',{student,message:message.value});await render()});
 const message=field(chat.form,'Lời nhắn',make('textarea'));
 message.required=true;message.maxLength=2000;chat.form.append(chat.submit);
 if(!records.messages.length)messages.append(make('p','Chưa có lời nhắn.'));
 for(const row of records.messages){
   const item=make('article');item.append(make('strong',(row.role==='teacher'?'Giáo viên':'Học sinh')+' · '+timestamp(row.created)),make('p',row.body));messages.append(item);
 }
}
async function startQuiz(topic,assignment){
 const {questions}=await api('/questions?'+(assignment?'assignment='+encodeURIComponent(assignment):'topic='+topic));
 app.replaceChildren();
 const panel=section(state.topics[topic]);
 panel.append(button('← Về lớp học',render));
 const {form,submit}=formIn(panel,'Nộp bài',async()=>{
   const data=new FormData(form);
   const result=await api('/submit',{topic,assignment,answers:questions.map((_,i)=>data.get('q'+i))});
   form.remove();panel.append(make('h3','Điểm '+result.score+'/'+result.total));
   result.review.forEach((row,i)=>panel.append(make('p',(i+1)+'. '+row.answer+' · '+row.solution)));
 });
 questions.forEach((q,i)=>{
   const group=make('fieldset');group.append(make('legend',(i+1)+'. '+q.prompt));
   q.options.forEach(option=>{const choice=input('radio');choice.name='q'+i;choice.value=option;field(group,option,choice)});
   form.append(group);
 });
 form.append(submit);panel.scrollIntoView();
}
async function registration(){
 const {email,profile}=await api('/registration');
 app.replaceChildren();notice.textContent='';
 const box=section('Đăng ký học sinh');
 box.append(link('← Đăng nhập lớp học','/lop-hoc'));
 if(profile){
   box.append(make('p',profile.active?'Tài khoản của bạn đã vào lớp.':profile.pending?'Đã gửi đăng ký. Vui lòng chờ giáo viên duyệt.':'Quyền vào lớp đang bị khóa. Hãy liên hệ giáo viên.'));
   return;
 }
 const {form,submit}=formIn(box,'Gửi đăng ký',async()=>{
   await api('/registration',{name:name.value,phone:phone.value});
   await registration();
 });
 const name=field(form,'Họ tên học sinh',input('text'));
 name.maxLength=80;name.autocomplete='name';
 const emailField=field(form,'Email Google',input('email'));
 emailField.value=email;emailField.readOnly=true;
 const phone=field(form,'Số điện thoại',input('tel'));
 phone.autocomplete='tel';phone.maxLength=24;
 form.append(submit);
}
function scrollToSection(){
 document.getElementById(location.hash.slice(1))?.scrollIntoView();
}
window.addEventListener('hashchange',async()=>{
 if(state&&!document.getElementById('messages'))await render();
 scrollToSection();
});
const registering=new URLSearchParams(location.search).get('mode')==='register';

(async()=>{
 try{
   const {user}=await api('/session');
   get('identity').append((user.teacher?'Giáo viên':'Tài khoản đang dùng')+' · '+user.email+' · ',link('Đổi tài khoản','/auth/logout?return_to=%2Flop-hoc'));
   if(registering&&user.teacher){location.replace('./lop-hoc.html#registrations');return}
   if(registering){await registration();return}
   state=await api();

   notice.textContent='';
   const original=new URLSearchParams(location.search).get('original');
   if(original&&!state.user.teacher){await startOriginal(original);return}
   await render();scrollToSection();
 }catch(error){
   notice.textContent=error.message||'Chưa mở được lớp học.';
   if(error.status===401)notice.append(' ',link('Mở trang đăng nhập',registering?'/dang-nhap?mode=register':'/dang-nhap'));
   if(error.status===403&&!registering)notice.append(' ',link('Đăng ký học sinh','/lop-hoc?mode=register'));
 }
})();
