<!doctype html>
<html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng nhập · Trạm Toán 6</title><script src="./config.js"></script><script>const backend=(window.TRAM_TOAN_CONFIG?.apiBase||"").replaceAll(String.fromCharCode(92),"");const originalFetch=window.fetch.bind(window);window.fetch=(input,options)=>{if(typeof input==="string"&&input.startsWith("/api/")){if(!backend)return Promise.resolve(new Response(JSON.stringify({error:"Chưa cấu hình máy chủ API trong config.js."}),{status:503,headers:{"Content-Type":"application/json"}}));input=backend+input;options={...options,credentials:"include"}}return originalFetch(input,options)};document.addEventListener("DOMContentLoaded",()=>{for(const a of document.querySelectorAll("a")){const href=a.getAttribute("href")||"";if(href.startsWith("/auth/")){if(backend)a.href=backend+href;else a.onclick=e=>{e.preventDefault();alert("Chưa cấu hình máy chủ đăng nhập.")}}}});</script>
<style>body{margin:0;background:#f4f7fb;color:#172746;font:16px/1.55 system-ui,sans-serif}main{max-width:480px;margin:9vh auto;padding:24px}section{padding:28px;border:1px solid #dce4f2;border-radius:18px;background:white}a{display:inline-block;padding:10px 14px;margin:4px 2px;border-radius:9px;background:#e8eeff;color:#203788;font-weight:750;text-decoration:none}.primary{background:#294cce;color:white}a:focus-visible{outline:3px solid #da7600}label{display:grid;gap:4px;margin:12px 0}input,button{font:inherit;padding:10px;border:1px solid #bbc9e3;border-radius:9px}button{cursor:pointer;font-weight:750}</style>
